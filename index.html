<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurassic Park RPG</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="game-shell">
      <section class="topbar" aria-label="资源与状态">
        <div class="brand">
          <span class="brand-mark">JP</span>
          <div>
            <h1>侏罗纪公园 RPG</h1>
            <p>生存建造防守图</p>
          </div>
        </div>
        <div class="resource-row">
          <span><b id="wood">0</b> 木材</span>
          <span><b id="meat">0</b> 食物</span>
          <span><b id="power">0</b> 电力</span>
          <span><b id="wave">1</b> 波次</span>
          <span><b id="timer">00:00</b></span>
        </div>
      </section>

      <section class="play-area">
        <aside class="panel left-panel">
          <div class="portrait">
            <img src="/assets/ranger.svg" alt="巡林员头像" />
            <div>
              <h2>艾伦 · 巡林员</h2>
              <p id="heroStatus">等级 1 / 未受伤</p>
            </div>
          </div>
          <div class="bar-label">
            <span>生命</span>
            <span id="hpText">100 / 100</span>
          </div>
          <div class="meter"><i id="hpBar"></i></div>
          <div class="bar-label">
            <span>经验</span>
            <span id="xpText">0 / 80</span>
          </div>
          <div class="meter xp"><i id="xpBar"></i></div>
          <div class="quest-box">
            <h3>当前任务</h3>
            <p id="questText">修复发电机，守住游客中心。</p>
          </div>
          <div class="mini-help">
            <span>WASD 移动</span>
            <span>鼠标左键 攻击/采集/修复</span>
            <span>1 炮塔</span>
            <span>2 围栏</span>
            <span>3 陷阱</span>
            <span>Q 治疗</span>
          </div>
        </aside>

        <div class="canvas-frame">
          <canvas id="game" width="1280" height="720" aria-label="侏罗纪公园游戏画布"></canvas>
          <div id="toast" class="toast">欢迎来到公园。</div>
        </div>

        <aside class="panel right-panel">
          <h2>建造</h2>
          <button class="build active" data-build="turret">
            <span class="icon">⌖</span>
            <span>
              <b>自动炮塔</b>
              <small>80 木材 / 25 电力</small>
            </span>
          </button>
          <button class="build" data-build="fence">
            <span class="icon">▥</span>
            <span>
              <b>高压围栏</b>
              <small>35 木材 / 10 电力</small>
            </span>
          </button>
          <button class="build" data-build="trap">
            <span class="icon">◇</span>
            <span>
              <b>麻醉陷阱</b>
              <small>45 木材 / 15 食物</small>
            </span>
          </button>
          <div class="log">
            <h3>公园广播</h3>
            <ul id="logList"></ul>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/game.js"></script>
  </body>
</html>
